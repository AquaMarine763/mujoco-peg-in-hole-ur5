# v50 early-approach-assist gate for the strict 1000-step multi-geometry stack.
#
# This config starts from the v47 early-final-servo boundary candidate and adds a
# default-on early approach assist for this evaluation only. The assist activates
# before normal guard handoff when the peg is still high and XY error remains
# large; it recenters laterally at a safe approach height, then hands back to the
# learned visual policy plus the existing guarded final insertion stack.
#
# Validation reference:
# D:\peg-in-hole-6yh\v50_early_approach_assist_gate
# 120/120 success, 0 collision, 0 timeout on seed 643000 with 10 ep/profile
# across profiles single/round_square/square_square/mixed_basic and crop offsets
# [-18,0], [+12,0], [+24,0].
