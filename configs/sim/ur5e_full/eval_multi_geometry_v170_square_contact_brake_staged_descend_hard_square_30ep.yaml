# v170 hard square-square contact-brake/staged-descend candidate.
#
# Base v164 already includes:
# - square recovery escape with deployable pre-lift queue-drain behavior
# - square pose/yaw alignment inherited from v148
# - hard square-square geometry/control stress
# - dynamic square_fast_settle XY cap: 3 mm normally, 2 mm below 55 mm Z
#
# v170 adds the current deployable hard-control insertion stack:
# - episode-level approach-adapter cap so high approach cannot consume the
#   whole 1000-step budget
# - square contact brake with 3 attempts
# - gated expanded preemptive hold, only when Z is high enough and tilted
#   clearance margin is not worse than -0.3 mm
# - staged high-Z re-descent with low-Z hold before returning to fast-settle
#
# Validation reference:
# D:\peg-in-hole-6yh\v170_A_brake3_gate_6x30
# seeds 921500/922500/923500/924500/925500/926500, 30 episodes each:
# 180/180 success, 0 collision, 0 timeout.
base_config: eval_multi_geometry_v164_square_escape_dynamic_xycap_hard_square_30ep.yaml

seed: 921500
episodes: 30
output_csv: results/ur5e_full/multi_geometry/v170_square_contact_brake_staged_descend/eval_hard_square_30ep_seed921500.csv
output_md: results/ur5e_full/multi_geometry/v170_square_contact_brake_staged_descend/eval_hard_square_30ep_seed921500.md
episode_output_csv: results/ur5e_full/multi_geometry/v170_square_contact_brake_staged_descend/eval_hard_square_30ep_seed921500_episodes.csv
