# v171 hard square-square late-down-boost diagnostic.
#
# Base v170 fixed the old 6x30 hard-square gate but failed the next fresh gate:
# - 927525 collision after final-insert adapter intervention
# - 929512 timeout after repeated recovery escape loops
#
# v171 keeps the v170 contact-brake/staged-descend stack and changes only:
# - disable the learned final-insert adapter for this hard square deployable gate
# - keep base square_fast_settle max down action at 0.0020
# - enable a narrow late square_fast_settle down boost to 0.0025 only after
#   three contact-brake attempts, tight XY alignment, enough phase age, and no
#   current peg-hole contact
# - when the boost is active, cap square_fast_settle XY action to 0.0010 to
#   avoid delayed lateral-control residue in the low square insert
#
# Previous rejected v171 attempt:
# - globally raising square_fast_settle max down action to 0.0025 passed
#   927500/928500/929500/925500, but regressed old seeds 921500 and 923500
#   with collisions.
#
# Validation result:
# - 927500 fresh hard square, 30 episodes: 30/30
# - 929500 fresh hard square, 30 episodes: 29/30, zero collision, one timeout
#   (`929512`). With the paired XY cap, the failure is a low-Z square timeout
#   rather than the earlier late lateral pop/collision mode.
# - Not promotable.
# Rejected probes:
# - globally lowering square recovery escape height to 0.060 fixed 929500 but
#   introduced a 928526 collision
# - 0.065 fixed 928500 but introduced a 929524 collision
base_config: eval_multi_geometry_v170_square_contact_brake_staged_descend_hard_square_30ep.yaml

