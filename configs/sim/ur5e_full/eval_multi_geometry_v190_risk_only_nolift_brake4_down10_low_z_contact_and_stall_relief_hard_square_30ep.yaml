# v190 diagnostic v189 + wall-contact low-Z relief.
#
# Rechecking v185/v189 showed 931500 is not actually clean: several failures
# pop out at low Z with wall contact already present, XY near 2 mm, and tilted
# clearance margin ranging from mildly positive to clearly negative. v189's
# no-contact stall relief fixes the 927521-style delayed pop but cannot trigger
# on these contact states. This config also enables the existing wall-contact
# low-Z relief path with a narrow Z/XY window and short lift/recenter action.
#
# Diagnostic only until 924/927/928/929/931 focused gates and full hard-square
# gates pass.
base_config: eval_multi_geometry_v189_risk_only_nolift_brake4_down10_low_z_stall_relief_hard_square_30ep.yaml

