# v198 diagnostic v195 + pre-pop no-contact low-Z relief.
#
# v195 fixes the 931509 timeout but can create a no-contact lateral pop after
# fast low-Z descent. The pop is visible one step before failure: square peg,
# no contact, z around 27-29 mm, near-centered XY, four brake attempts, and
# late square_fast_settle phase. Existing v189 stall relief is too strict
# because these pops happen before the stall counter reaches 12. This candidate
# reuses the same short low-Z relief phase but lets it trigger in that narrow
# pre-pop window without waiting for stall.
#
# Diagnostic only until focused and broad hard-square gates pass.
base_config: eval_multi_geometry_v195_risk_only_nolift_brake4_down10_late_down_boost_only_hard_square_30ep.yaml

guard_final_servo_square_fast_settle_low_z_stall_relief_xy_max: 0.0025
guard_final_servo_square_fast_settle_low_z_stall_relief_z_min: 0.026
guard_final_servo_square_fast_settle_low_z_stall_relief_z_max: 0.0305
guard_final_servo_square_fast_settle_low_z_stall_relief_margin_min: -0.0002
guard_final_servo_square_fast_settle_low_z_stall_relief_margin_threshold: 0.0010
guard_final_servo_square_fast_settle_low_z_stall_relief_contact_max: 0
guard_final_servo_square_fast_settle_low_z_stall_relief_min_brake_attempts: 4
guard_final_servo_square_fast_settle_low_z_stall_relief_min_phase_steps: 45
guard_final_servo_square_fast_settle_low_z_stall_relief_min_stall_steps: 0
guard_final_servo_square_fast_settle_low_z_stall_relief_max_attempts: 1
