# v215 diagnostic v208 + state-aware recovery-escape recenter descent.
#
# v208 is collision-safe on 931500 but times out when the escape recenter phase
# spends late budget lifting/holding near 60-66 mm before returning to
# square_fast_settle. This candidate keeps the positive-margin pre-pop hold from
# v208, prevents recenter from continuing to lift, and allows only clean,
# high-Z, no-contact recenter states to descend slowly while XY recenters.
#
# Diagnostic only until 924/927/928/929/931 focused gates pass.
base_config: eval_multi_geometry_v208_v207_positive_margin_hold_hard_square_30ep.yaml

guard_final_servo_square_recovery_escape_recenter_no_up_enabled: true
guard_final_servo_square_recovery_escape_recenter_descend_enabled: true
guard_final_servo_square_recovery_escape_recenter_descend_xy_max: 0.020
guard_final_servo_square_recovery_escape_recenter_descend_z_min: 0.045
guard_final_servo_square_recovery_escape_recenter_descend_z_max: 0.075
guard_final_servo_square_recovery_escape_recenter_descend_contact_max: 0
guard_final_servo_square_recovery_escape_recenter_descend_margin_min: -0.0015
guard_final_servo_square_recovery_escape_recenter_descend_max_down_action: 0.0015
