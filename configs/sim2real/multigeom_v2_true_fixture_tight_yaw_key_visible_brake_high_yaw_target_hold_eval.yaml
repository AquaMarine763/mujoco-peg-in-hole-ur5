# Visible-brake baseline with high-yaw target preservation.
# Diagnostic only. Unlike near_control activation, this keeps the visual-yaw
# supervisor in the existing final-servo activation window, but lets the target
# hold latch preserve large-yaw correction targets through later gate dropouts.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_eval.yaml

guard_visual_yaw_align_hold_target_steps: 360
guard_visual_yaw_align_hold_target_arm_yaw_deg: 180.0
guard_visual_yaw_align_hold_target_release_yaw_deg: 180.0
guard_visual_yaw_align_hold_target_release_xy: 0.180
guard_visual_yaw_align_hold_target_min_z: 0.000
guard_visual_yaw_align_hold_target_max_z: 0.160
guard_visual_yaw_align_hold_target_block_descent: true

output_csv: results/vy_visible_brake_high_yaw_target_hold/eval_latest.csv
output_md: results/vy_visible_brake_high_yaw_target_hold/eval_latest.md
episode_output_csv: results/vy_visible_brake_high_yaw_target_hold/eval_latest_episodes.csv
step_output_csv: results/vy_visible_brake_high_yaw_target_hold/eval_latest_steps.csv
