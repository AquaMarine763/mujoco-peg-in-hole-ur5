# Rectangular-key post-yaw reapproach plus selective low-Z verifier v2.
#
# v1 avoided collision but could hover/timeout because the verifier only fired
# below 5cm and used an upward recovery action. v2 keeps the hard-frame
# verifier active through the 7cm near-hole band and holds Z in place while the
# yaw correction settles.

base_config: multigeom_v2_true_fixture_tight_yaw_key_visible_brake_low_z_crop_high_centered_local_hold_stronger_brake_early_approach_post_yaw_reapproach_low_z_verifier_v1_eval.yaml

guard_visual_yaw_align_low_z_verifier_max_z: 0.070
guard_visual_yaw_align_low_z_verifier_max_correction_deg: 25.0
guard_visual_yaw_align_low_z_verifier_up_action: 0.0
guard_visual_yaw_align_low_z_verifier_max_xy_action: 0.0015

output_csv: results/rectangular_key_post_yaw_reapproach_low_z_verifier_v2/eval_latest.csv
output_md: results/rectangular_key_post_yaw_reapproach_low_z_verifier_v2/eval_latest.md
episode_output_csv: results/rectangular_key_post_yaw_reapproach_low_z_verifier_v2/eval_latest_episodes.csv
step_output_csv: results/rectangular_key_post_yaw_reapproach_low_z_verifier_v2/eval_latest_steps.csv
