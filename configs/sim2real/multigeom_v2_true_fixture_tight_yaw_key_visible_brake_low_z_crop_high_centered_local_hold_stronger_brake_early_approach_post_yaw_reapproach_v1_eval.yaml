# Rectangular-key early approach plus post-yaw XY reapproach.
#
# The residual key timeout after early-approach routing is a high-Z/far-XY
# failure: large visual-yaw corrections near the hole can move the IK target
# laterally, then final-servo spends the rest of the episode recovering from
# 10-25cm XY error. This variant keeps the accepted yaw target, lifts/holds at
# a safe height, recenters XY, then releases back to visual realign/descent.

base_config: multigeom_v2_true_fixture_tight_yaw_key_visible_brake_low_z_crop_high_centered_local_hold_stronger_brake_early_approach_v1_eval.yaml

guard_visual_yaw_align_post_yaw_reapproach_enabled: true
guard_visual_yaw_align_post_yaw_reapproach_profiles: [rectangular_key]
guard_visual_yaw_align_post_yaw_reapproach_allow_applied_trigger: true
guard_visual_yaw_align_post_yaw_reapproach_max_attempts: 2
guard_visual_yaw_align_post_yaw_reapproach_trigger_min_step: 40
guard_visual_yaw_align_post_yaw_reapproach_trigger_min_xy: 0.030
guard_visual_yaw_align_post_yaw_reapproach_trigger_max_xy: 0.180
guard_visual_yaw_align_post_yaw_reapproach_trigger_min_z: 0.055
guard_visual_yaw_align_post_yaw_reapproach_trigger_max_z: 0.145
guard_visual_yaw_align_post_yaw_reapproach_trigger_max_yaw_deg: 180.0
guard_visual_yaw_align_post_yaw_reapproach_lift_target_z: 0.125
guard_visual_yaw_align_post_yaw_reapproach_lift_z_tolerance: 0.006
guard_visual_yaw_align_post_yaw_reapproach_lift_max_steps: 45
guard_visual_yaw_align_post_yaw_reapproach_recenter_release_xy: 0.012
guard_visual_yaw_align_post_yaw_reapproach_realign_release_xy: 0.020
guard_visual_yaw_align_post_yaw_reapproach_realign_release_min_z: 0.095
guard_visual_yaw_align_post_yaw_reapproach_recenter_stable_steps: 3
guard_visual_yaw_align_post_yaw_reapproach_recenter_max_steps: 220
guard_visual_yaw_align_post_yaw_reapproach_descent_yaw_deg: 12.0
guard_visual_yaw_align_post_yaw_reapproach_descent_max_steps: 220
guard_visual_yaw_align_post_yaw_reapproach_descent_max_down_action: 0.0025
guard_visual_yaw_align_post_yaw_reapproach_max_up_action: 0.006
guard_visual_yaw_align_post_yaw_reapproach_max_xy_action: 0.008
guard_visual_yaw_align_post_yaw_reapproach_reset_target_on_trigger: false
guard_visual_yaw_align_post_yaw_reapproach_release_to_visual_realign: true
guard_visual_yaw_align_post_yaw_reapproach_reset_target_on_release: true
guard_visual_yaw_align_post_yaw_reapproach_block_background_targets: true
guard_visual_yaw_align_post_yaw_reapproach_flush_history: true

output_csv: results/rectangular_key_stronger_brake_early_approach_post_yaw_reapproach_v1/eval_latest.csv
output_md: results/rectangular_key_stronger_brake_early_approach_post_yaw_reapproach_v1/eval_latest.md
episode_output_csv: results/rectangular_key_stronger_brake_early_approach_post_yaw_reapproach_v1/eval_latest_episodes.csv
step_output_csv: results/rectangular_key_stronger_brake_early_approach_post_yaw_reapproach_v1/eval_latest_steps.csv
