# Gated narrow re-acquire plus low-Z lateral-pop recovery.
# Diagnostic only. This targets the late rectangular-key failure tail observed
# after gated re-acquire: the peg is already near the hole, XY suddenly jumps
# because delayed actions keep executing, and the episode otherwise times out
# or later collides. On trigger it flushes the control-randomization history,
# lifts, recenters, then releases.

base_config: multigeom_v2_true_fixture_tight_yaw_key_visible_brake_wrong_basin_reacquire_narrow_eval.yaml

guard_visual_yaw_align_low_z_lateral_pop_recovery_enabled: true
guard_visual_yaw_align_low_z_lateral_pop_recovery_profiles: [rectangular_key]
guard_visual_yaw_align_low_z_lateral_pop_recovery_max_attempts: 1
guard_visual_yaw_align_low_z_lateral_pop_recovery_trigger_min_step: 850
guard_visual_yaw_align_low_z_lateral_pop_recovery_trigger_min_xy: 0.015
guard_visual_yaw_align_low_z_lateral_pop_recovery_trigger_max_z: 0.045
guard_visual_yaw_align_low_z_lateral_pop_recovery_trigger_prev_xy: 0.008
guard_visual_yaw_align_low_z_lateral_pop_recovery_trigger_xy_jump: 0.010
guard_visual_yaw_align_low_z_lateral_pop_recovery_lift_target_z: 0.065
guard_visual_yaw_align_low_z_lateral_pop_recovery_lift_z_tolerance: 0.006
guard_visual_yaw_align_low_z_lateral_pop_recovery_lift_max_steps: 20
guard_visual_yaw_align_low_z_lateral_pop_recovery_recenter_release_xy: 0.010
guard_visual_yaw_align_low_z_lateral_pop_recovery_recenter_max_steps: 80
guard_visual_yaw_align_low_z_lateral_pop_recovery_max_up_action: 0.008
guard_visual_yaw_align_low_z_lateral_pop_recovery_max_xy_action: 0.010
guard_visual_yaw_align_low_z_lateral_pop_recovery_flush_history: true

output_csv: results/vy_visible_brake_wrong_basin_reacquire_narrow_low_z_lateral_pop_recovery/eval_latest.csv
output_md: results/vy_visible_brake_wrong_basin_reacquire_narrow_low_z_lateral_pop_recovery/eval_latest.md
episode_output_csv: results/vy_visible_brake_wrong_basin_reacquire_narrow_low_z_lateral_pop_recovery/eval_latest_episodes.csv
step_output_csv: results/vy_visible_brake_wrong_basin_reacquire_narrow_low_z_lateral_pop_recovery/eval_latest_steps.csv
