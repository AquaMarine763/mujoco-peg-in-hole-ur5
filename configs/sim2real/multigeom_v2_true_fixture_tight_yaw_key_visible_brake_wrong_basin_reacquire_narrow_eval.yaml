# Visible-brake baseline plus narrow wrong-basin re-acquire.
# Diagnostic only. Unlike wrong_basin_hold, this does not preserve a stale
# orientation target for many steps. It triggers a short lift/recenter retry
# only when the rectangular-key visual yaw predictor sees a stable large error
# inside a near-hole XY/Z window, then allows visible/stable yaw correction and
# slow descent only after yaw and XY have recovered.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_eval.yaml

guard_visual_yaw_align_reacquire_enabled: true
guard_visual_yaw_align_reacquire_profiles: [rectangular_key]
guard_visual_yaw_align_reacquire_max_attempts: 1
guard_visual_yaw_align_reacquire_min_step: 280
guard_visual_yaw_align_reacquire_trigger_min_xy: 0.030
guard_visual_yaw_align_reacquire_trigger_max_xy: 0.075
guard_visual_yaw_align_reacquire_trigger_min_z: 0.000
guard_visual_yaw_align_reacquire_trigger_max_z: 0.100
guard_visual_yaw_align_reacquire_trigger_min_pred_yaw_deg: 90.0
guard_visual_yaw_align_reacquire_trigger_require_visible: true
guard_visual_yaw_align_reacquire_trigger_require_stable_delta: true
guard_visual_yaw_align_reacquire_trigger_stable_window: 3
guard_visual_yaw_align_reacquire_trigger_max_delta_deg: 10.0
guard_visual_yaw_align_reacquire_xy_gate_trigger_enabled: true
guard_visual_yaw_align_reacquire_xy_gate_min_xy: 0.055
guard_visual_yaw_align_reacquire_lift_target_z: 0.105
guard_visual_yaw_align_reacquire_lift_z_tolerance: 0.006
guard_visual_yaw_align_reacquire_lift_max_steps: 45
guard_visual_yaw_align_reacquire_recenter_max_steps: 160
guard_visual_yaw_align_reacquire_recenter_release_xy: 0.016
guard_visual_yaw_align_reacquire_max_up_action: 0.006
guard_visual_yaw_align_reacquire_max_xy_action: 0.008
guard_visual_yaw_align_reacquire_flush_history: true

guard_visual_yaw_align_reacquire_relaxed_yaw_enabled: true
guard_visual_yaw_align_reacquire_relaxed_yaw_require_visible: true
guard_visual_yaw_align_reacquire_relaxed_yaw_require_stable_delta: true
guard_visual_yaw_align_reacquire_relaxed_yaw_stable_window: 3
guard_visual_yaw_align_reacquire_relaxed_yaw_max_delta_deg: 10.0
guard_visual_yaw_align_reacquire_relaxed_yaw_allow_visible_reapply: true
guard_visual_yaw_align_reacquire_relaxed_yaw_min_pred_yaw_deg: 30.0
guard_visual_yaw_align_reacquire_relaxed_yaw_max_correction_deg: 25.0
guard_visual_yaw_align_reacquire_relaxed_yaw_min_z: 0.050
guard_visual_yaw_align_reacquire_relaxed_yaw_max_z: 0.130

guard_visual_yaw_align_reacquire_descent_enabled: true
guard_visual_yaw_align_reacquire_descent_yaw_deg: 8.0
guard_visual_yaw_align_reacquire_descent_xy: 0.030
guard_visual_yaw_align_reacquire_descent_min_z: 0.030
guard_visual_yaw_align_reacquire_descent_max_z: 0.130
guard_visual_yaw_align_reacquire_descent_max_down_action: 0.003

guard_visual_yaw_align_large_xy_low_z_brake_enabled: true
guard_visual_yaw_align_large_xy_low_z_brake_min_xy: 0.040
guard_visual_yaw_align_large_xy_low_z_brake_max_z: 0.045
guard_visual_yaw_align_large_xy_low_z_brake_up_action: 0.008
guard_visual_yaw_align_large_xy_low_z_brake_flush_history: true

output_csv: results/vy_visible_brake_wrong_basin_reacquire_narrow/eval_latest.csv
output_md: results/vy_visible_brake_wrong_basin_reacquire_narrow/eval_latest.md
episode_output_csv: results/vy_visible_brake_wrong_basin_reacquire_narrow/eval_latest_episodes.csv
step_output_csv: results/vy_visible_brake_wrong_basin_reacquire_narrow/eval_latest_steps.csv
