# Bounded re-acquire plus conservative descent-abort diagnostic.
# Unlike the relaxed-yaw candidate, this keeps the original visual-yaw
# correction gate unchanged. Descent-abort is allowed only after the visual
# yaw path is gated/unreliable, so it should act as a late safety/recovery
# phase rather than a competing alignment controller.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire_eval.yaml

guard_visual_yaw_align_descent_abort_enabled: true
guard_visual_yaw_align_descent_abort_profiles: [rectangular_key]
guard_visual_yaw_align_descent_abort_max_attempts: 2
guard_visual_yaw_align_descent_abort_min_step: 250
guard_visual_yaw_align_descent_abort_require_unreliable_visual: true
guard_visual_yaw_align_descent_abort_allow_large_pred_yaw: true
guard_visual_yaw_align_descent_abort_large_pred_yaw_deg: 45.0
guard_visual_yaw_align_descent_abort_min_xy: 0.030
guard_visual_yaw_align_descent_abort_max_z: 0.080
guard_visual_yaw_align_descent_abort_lift_target_z: 0.105
guard_visual_yaw_align_descent_abort_lift_z_tolerance: 0.006
guard_visual_yaw_align_descent_abort_lift_max_steps: 60
guard_visual_yaw_align_descent_abort_recenter_max_steps: 220
guard_visual_yaw_align_descent_abort_recenter_release_xy: 0.018
guard_visual_yaw_align_descent_abort_max_up_action: 0.008
guard_visual_yaw_align_descent_abort_max_xy_action: 0.010
guard_visual_yaw_align_descent_abort_flush_history: true

output_csv: results/vy_reacquire_descent_abort_unreliable/eval_latest.csv
output_md: results/vy_reacquire_descent_abort_unreliable/eval_latest.md
episode_output_csv: results/vy_reacquire_descent_abort_unreliable/eval_latest_episodes.csv
step_output_csv: results/vy_reacquire_descent_abort_unreliable/eval_latest_steps.csv
