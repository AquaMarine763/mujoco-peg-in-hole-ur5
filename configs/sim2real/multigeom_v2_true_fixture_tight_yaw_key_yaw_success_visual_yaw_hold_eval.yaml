# Keyhole yaw-sensitive evaluation with visual yaw hold.
# The visual yaw estimator is allowed to pause descent and hold the peg above
# the hole while wrist yaw converges. This is intended to test true key-tab
# alignment before training a learned wrist-yaw policy.

base_config: multigeom_v2_true_fixture_tight_yaw_visual_yaw_align_eval.yaml

success_shape_yaw_tolerance_deg: 10.0
success_shape_yaw_profiles: [rectangular_key]

guard_visual_yaw_align_profiles: [rectangular_key]
guard_visual_yaw_align_max_xy: 0.016
guard_visual_yaw_align_min_z: 0.006
guard_visual_yaw_align_max_z: 0.120
guard_visual_yaw_align_deadband_deg: 2.0
guard_visual_yaw_align_max_correction_deg: 30.0
guard_visual_yaw_align_block_descent: true
guard_visual_yaw_align_block_descent_deg: 10.0
guard_visual_yaw_align_hold_z_enabled: true
guard_visual_yaw_align_hold_z_min: 0.050
guard_visual_yaw_align_hold_up_action: 0.004
guard_visual_yaw_align_ik_control_mode: pose_tip_priority
guard_visual_yaw_align_ik_orientation_weight: 0.45

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold/eval_latest_steps.csv
