# Keyhole yaw-hold with XY/Z hold.
# While visual yaw is outside the success band, override policy XY/Z actions to
# keep the peg near the hole center and above the fixture, then let the wrist yaw
# correction converge before insertion.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_eval.yaml

guard_visual_yaw_align_activation_mode: near_control
guard_visual_yaw_align_max_xy: 0.040
guard_visual_yaw_align_min_z: 0.006
guard_visual_yaw_align_max_z: 0.160
guard_visual_yaw_align_max_correction_deg: 60.0
guard_visual_yaw_align_block_descent_deg: 10.0
guard_visual_yaw_align_hold_z_min: 0.075
guard_visual_yaw_align_hold_up_action: 0.006
guard_visual_yaw_align_hold_xy_enabled: true
guard_visual_yaw_align_hold_xy_tolerance: 0.0025
guard_visual_yaw_align_hold_max_xy_action: 0.003
guard_visual_yaw_align_ik_control_mode: pose_tip_priority
guard_visual_yaw_align_ik_orientation_weight: 0.75
ik_step_limit: 0.08
ik_max_iterations: 96

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy/eval_latest_steps.csv
