# Keyhole yaw-hold/recenter with conservative commit descent.
# This keeps the strict visual yaw/recenter baseline and only commands active
# insertion after several consecutive visually aligned, well-centered steps.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_strict_eval.yaml

guard_visual_yaw_align_aligned_descent_enabled: true
guard_visual_yaw_align_aligned_descent_yaw_deg: 1.0
guard_visual_yaw_align_aligned_descent_xy: 0.010
guard_visual_yaw_align_aligned_descent_min_z: 0.015
guard_visual_yaw_align_aligned_descent_max_z: 0.075
guard_visual_yaw_align_aligned_descent_required_steps: 4
guard_visual_yaw_align_aligned_descent_max_down_action: 0.0035
guard_visual_yaw_align_aligned_descent_max_xy_action: 0.004

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent/eval_latest_steps.csv
