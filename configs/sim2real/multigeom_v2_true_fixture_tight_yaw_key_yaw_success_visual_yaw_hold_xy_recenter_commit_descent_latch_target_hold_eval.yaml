# Keyhole visual yaw-align with bounded commit descent and post-align target hold.
# This diagnostic keeps the last visually aligned IK orientation target alive
# through short raw-norm/XY gate dropouts, while blocking descent and recentering
# XY. It tests the observed failure mode where true yaw reaches near zero and
# later drifts back to the 180 deg basin after the visual controller exits.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_eval.yaml

guard_visual_yaw_align_hold_target_enabled: true
guard_visual_yaw_align_hold_target_steps: 180
guard_visual_yaw_align_hold_target_arm_yaw_deg: 3.0
guard_visual_yaw_align_hold_target_release_xy: 0.180
guard_visual_yaw_align_hold_target_min_z: 0.000
guard_visual_yaw_align_hold_target_max_z: 0.160
guard_visual_yaw_align_hold_target_block_descent: true

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold/eval_latest_steps.csv
