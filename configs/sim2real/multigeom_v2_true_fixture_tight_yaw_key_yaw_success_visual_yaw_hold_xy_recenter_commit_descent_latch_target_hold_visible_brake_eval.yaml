# Safer target-hold diagnostic with low-visibility brake.
# Extends the visible target-hold variant with a collision-safety brake for the
# failure tail where yaw visibility drops, predicted yaw becomes large, XY is
# still off-center, and the peg is already low enough that delayed downward
# action can hit the plate.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_eval.yaml

guard_visual_yaw_align_low_visibility_brake_enabled: true
guard_visual_yaw_align_low_visibility_brake_min_pred_yaw_deg: 12.0
guard_visual_yaw_align_low_visibility_brake_min_xy: 0.020
guard_visual_yaw_align_low_visibility_brake_max_z: 0.080
guard_visual_yaw_align_low_visibility_brake_up_action: 0.008
guard_visual_yaw_align_low_visibility_brake_flush_history: true

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake/eval_latest_steps.csv
