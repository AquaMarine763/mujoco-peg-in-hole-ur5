# Conservative re-acquire relaxed-yaw diagnostic.
# Starts from the bounded re-acquire retry config, but only allows the
# relaxed-yaw path when the prediction passes the same visibility statistics
# used by the normal runtime gate and the recent signed-yaw predictions are
# temporally stable. This is diagnostic-only and must not replace the brake
# baseline without a full multi-seed gate.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire_eval.yaml

guard_visual_yaw_align_reacquire_relaxed_yaw_enabled: true
guard_visual_yaw_align_reacquire_relaxed_yaw_require_visible: true
guard_visual_yaw_align_reacquire_relaxed_yaw_require_stable_delta: true
guard_visual_yaw_align_reacquire_relaxed_yaw_stable_window: 3
guard_visual_yaw_align_reacquire_relaxed_yaw_max_delta_deg: 12.0
guard_visual_yaw_align_reacquire_relaxed_yaw_allow_visible_reapply: true
guard_visual_yaw_align_reacquire_relaxed_yaw_min_pred_yaw_deg: 30.0
guard_visual_yaw_align_reacquire_relaxed_yaw_max_correction_deg: 30.0

