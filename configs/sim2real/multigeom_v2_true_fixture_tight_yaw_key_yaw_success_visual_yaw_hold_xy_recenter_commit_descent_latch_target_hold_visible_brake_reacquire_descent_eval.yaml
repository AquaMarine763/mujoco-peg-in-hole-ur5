# Re-acquire with visible-yaw descent diagnostic.
# Keeps relaxed yaw correction disabled, but allows a slow downward action while
# re-acquire is still active once the same-step visual yaw prediction is visible,
# yaw error is small, XY is near enough, and Z is still high. This targets
# timeouts where re-acquire holds the peg high until too late.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire_eval.yaml

guard_visual_yaw_align_reacquire_descent_enabled: true
guard_visual_yaw_align_reacquire_descent_yaw_deg: 8.0
guard_visual_yaw_align_reacquire_descent_xy: 0.035
guard_visual_yaw_align_reacquire_descent_min_z: 0.025
guard_visual_yaw_align_reacquire_descent_max_z: 0.130
guard_visual_yaw_align_reacquire_descent_max_down_action: 0.003
guard_visual_yaw_align_reacquire_relaxed_yaw_enabled: false

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire_descent/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire_descent/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire_descent/eval_latest_episodes.csv
