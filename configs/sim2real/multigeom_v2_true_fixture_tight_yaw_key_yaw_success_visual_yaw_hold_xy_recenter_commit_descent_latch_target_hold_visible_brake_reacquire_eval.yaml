# Bounded keyhole yaw re-acquire diagnostic.
# Extends the safer low-visibility brake variant with one guarded lift/recenter
# retry for late rectangular_key wrong-yaw-basin timeouts. The trigger uses only
# visual yaw prediction, XY/Z progress, contact count, and step timing; simulator
# yaw truth remains diagnostic-only.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_eval.yaml

guard_visual_yaw_align_reacquire_enabled: true
guard_visual_yaw_align_reacquire_profiles: [rectangular_key]
guard_visual_yaw_align_reacquire_max_attempts: 2
guard_visual_yaw_align_reacquire_min_step: 350
guard_visual_yaw_align_reacquire_trigger_min_xy: 0.020
guard_visual_yaw_align_reacquire_trigger_max_xy: 0.240
guard_visual_yaw_align_reacquire_trigger_min_z: 0.000
guard_visual_yaw_align_reacquire_trigger_max_z: 0.120
guard_visual_yaw_align_reacquire_trigger_min_pred_yaw_deg: 45.0
guard_visual_yaw_align_reacquire_xy_gate_trigger_enabled: true
guard_visual_yaw_align_reacquire_xy_gate_min_xy: 0.080
guard_visual_yaw_align_reacquire_lift_target_z: 0.105
guard_visual_yaw_align_reacquire_lift_z_tolerance: 0.006
guard_visual_yaw_align_reacquire_lift_max_steps: 35
guard_visual_yaw_align_reacquire_recenter_max_steps: 220
guard_visual_yaw_align_reacquire_recenter_release_xy: 0.018
guard_visual_yaw_align_reacquire_max_up_action: 0.006
guard_visual_yaw_align_reacquire_max_xy_action: 0.010
guard_visual_yaw_align_reacquire_flush_history: true
guard_visual_yaw_align_reacquire_relaxed_yaw_enabled: false
guard_visual_yaw_align_reacquire_relaxed_yaw_min_pred_yaw_deg: 30.0
guard_visual_yaw_align_reacquire_relaxed_yaw_max_correction_deg: 45.0
guard_visual_yaw_align_reacquire_relaxed_yaw_min_z: 0.050
guard_visual_yaw_align_reacquire_relaxed_yaw_max_z: 0.130

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible_brake_reacquire/eval_latest_steps.csv
