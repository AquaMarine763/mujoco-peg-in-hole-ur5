# Safer target-hold diagnostic.
# Keeps post-align target hold, but only allows aligned descent when the current
# visual yaw prediction passed visibility/confidence gates on the same step.
# This specifically tests the 911500 collision tail caused by descending while
# the controller was in target_hold_raw_norm_gate.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_eval.yaml

guard_visual_yaw_align_aligned_descent_require_visible: true
guard_visual_yaw_align_aligned_descent_latch_release_yaw_deg: 4.0
guard_visual_yaw_align_aligned_descent_max_down_action: 0.0030
guard_visual_yaw_align_hold_target_release_yaw_deg: 8.0

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_target_hold_visible/eval_latest_steps.csv
