# Keyhole yaw-hold/recenter with bounded commit descent from a 3 cm XY window.
# This tests whether near-miss episodes can be rescued by committing slightly
# earlier while still recentering aggressively before the final millimeters.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_eval.yaml

guard_visual_yaw_align_aligned_descent_xy: 0.030
guard_visual_yaw_align_aligned_descent_max_xy_action: 0.006
guard_visual_yaw_align_aligned_descent_latch_release_xy: 0.030

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_xy30/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_xy30/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_xy30/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_latch_xy30/eval_latest_steps.csv
