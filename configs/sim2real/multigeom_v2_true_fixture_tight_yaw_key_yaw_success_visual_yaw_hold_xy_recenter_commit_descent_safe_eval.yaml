# Keyhole yaw-hold/recenter with safe commit descent.
# Compared with the first commit-descent diagnostic, this uses a wider but
# still bounded visual-yaw window because the strict 1 deg/1 cm gate almost
# never triggered in smoke traces.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_strict_eval.yaml

guard_visual_yaw_align_aligned_descent_enabled: true
guard_visual_yaw_align_aligned_descent_yaw_deg: 2.0
guard_visual_yaw_align_aligned_descent_xy: 0.020
guard_visual_yaw_align_aligned_descent_min_z: 0.010
guard_visual_yaw_align_aligned_descent_max_z: 0.090
guard_visual_yaw_align_aligned_descent_required_steps: 3
guard_visual_yaw_align_aligned_descent_max_down_action: 0.0035
guard_visual_yaw_align_aligned_descent_max_xy_action: 0.004

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_safe/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_safe/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_safe/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_commit_descent_safe/eval_latest_steps.csv
