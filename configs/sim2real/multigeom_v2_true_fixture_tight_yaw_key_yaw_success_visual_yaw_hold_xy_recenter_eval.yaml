# Keyhole yaw-hold with post-yaw recenter.
# After visual yaw reaches the deadband, keep holding descent and recenter XY
# until the peg is close enough to the hole center, then release insertion.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_wide_eval.yaml

guard_visual_yaw_align_recenter_after_yaw_enabled: true
guard_visual_yaw_align_recenter_release_xy: 0.006
guard_visual_yaw_align_recenter_block_descent: true

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter/eval_latest_steps.csv
