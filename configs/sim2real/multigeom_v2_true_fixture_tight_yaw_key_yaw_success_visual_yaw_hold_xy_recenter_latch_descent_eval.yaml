# Keyhole yaw-hold/recenter with latch and aligned descent.
# Builds on the strict diagnostic controller. The latch prevents brief visual
# confidence/XY-gate dropouts from releasing XY/Z hold, and aligned descent
# actively inserts when visual yaw is tight and XY is close enough.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_strict_eval.yaml

guard_visual_yaw_align_latch_enabled: true
guard_visual_yaw_align_latch_steps: 160
guard_visual_yaw_align_latch_max_xy: 0.220
guard_visual_yaw_align_latch_min_z: 0.000
guard_visual_yaw_align_latch_max_z: 0.180

guard_visual_yaw_align_aligned_descent_enabled: true
guard_visual_yaw_align_aligned_descent_yaw_deg: 1.2
guard_visual_yaw_align_aligned_descent_xy: 0.025
guard_visual_yaw_align_aligned_descent_min_z: 0.010
guard_visual_yaw_align_aligned_descent_max_down_action: 0.0045
guard_visual_yaw_align_aligned_descent_max_xy_action: 0.005

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_latch_descent/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_latch_descent/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_latch_descent/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_latch_descent/eval_latest_steps.csv
