# Conservative keyhole yaw-hold/recenter diagnostic.
# Uses tighter visual thresholds to compensate for near-threshold yaw estimator
# bias before releasing the final descent.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_wide_eval.yaml

guard_visual_yaw_align_deadband_deg: 0.5
guard_visual_yaw_align_block_descent_deg: 2.0
guard_visual_yaw_align_recenter_release_xy: 0.006

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_strict/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_strict/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_strict/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_strict/eval_latest_steps.csv
