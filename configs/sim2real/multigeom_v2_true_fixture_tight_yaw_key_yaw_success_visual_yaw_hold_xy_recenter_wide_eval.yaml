# Wider post-yaw recenter diagnostic.
# Allows the visual-yaw/recenter supervisor to remain active after wrist yaw
# alignment even when rotation has pulled the tip far from the hole center.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_eval.yaml

guard_visual_yaw_align_max_xy: 0.140
guard_visual_yaw_align_hold_max_xy_action: 0.005
guard_visual_yaw_align_recenter_release_xy: 0.008

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_wide/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_wide/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_wide/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_recenter_wide/eval_latest_steps.csv
