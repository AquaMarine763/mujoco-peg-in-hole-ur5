# Wider keyhole yaw-hold diagnostic.
# Keeps visual yaw active over a wider XY region and uses stronger XY hold so
# the controller has enough time to test wrist-yaw convergence.

base_config: multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_eval.yaml

guard_visual_yaw_align_max_xy: 0.080
guard_visual_yaw_align_max_correction_deg: 90.0
guard_visual_yaw_align_hold_max_xy_action: 0.006
guard_visual_yaw_align_ik_orientation_weight: 0.90

output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_wide/eval_latest.csv
output_md: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_wide/eval_latest.md
episode_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_wide/eval_latest_episodes.csv
step_output_csv: results/sim2real_multigeom_v2_true_fixture_tight_yaw_key_yaw_success_visual_yaw_hold_xy_wide/eval_latest_steps.csv
