# Diagnostic eval for the current key-focused crop-wider visual yaw estimator.
# This reports held-out validation error by geometry profile and yaw bin, then
# writes a worst-case image sheet for the rectangular-key profile.

dataset: datasets/visual_yaw_v1_tight_yaw_key_focus_2k_crop_wider.npz
checkpoint: results/visual_yaw_estimator_v1_tight_yaw_key_focus_2k_crop_wider.pt
output_md: results/visual_yaw_estimator_v1_tight_yaw_key_focus_2k_crop_wider_eval.md
output_json: results/visual_yaw_estimator_v1_tight_yaw_key_focus_2k_crop_wider_eval.json
worst_sheet: results/visual_yaw_estimator_v1_tight_yaw_key_focus_2k_crop_wider_eval_worst_key.png

split: validation
batch_size: 128
device: auto
bin_count: 12
bad_threshold_deg: 15.0
worst_count: 24
worst_cols: 4
worst_profiles: [rectangular_key]
